[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentir-local"
version = "0.1.0"
description = "Cache-only PlugIR retrieval experiments on the team's saved VisDial 50k pool"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.11.0", "torchvision==0.26.0", "transformers==4.51.3",
  "tokenizers==0.21.4", "huggingface-hub==0.30.2", "pillow==11.3.0",
  "numpy==2.2.6", "tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
